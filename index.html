<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Javascript Functions</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1 id="main-title">Welcome to My Page</h1>
  </header>

  <main>
    <section>
      <p id="description">This paragraph will be updated using JavaScript.<br></p>
      <p  id="description">This is an example of DOM and Javascript.<br></p>
      <button id="changeTextBtn">Change Text</button><br> <br>
      <button id="changeStyleBtn">Change Style</button> <br> <br>
    </section>

    <section>
      <button id="toggleElementBtn">Add/Remove Box</button>
      <div id="container"></div>
    </section>
  </main>
  <section>
    <h2>Contact Me</h2>
    <form id="contactForm">
      <label for="name">Name:</label>
      <input type="text" id="name" required minlength="7"/>
  
      <label for="message">Message:</label>
      <textarea id="message" required minlength="10"></textarea>
  
      <button type="submit">Send</button>

    </form>
  
    <div id="submittedData"></div>
  </section>
  <br>  <br>
  <button id="changeBgBtn">Change Background Color</button>

  <footer>
    <p>&copy;Reserved, Victoria</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
